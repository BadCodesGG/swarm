name: CI

# Only the env branches build. A branch runs these checks locally before its one push, so a pull request
# runs nothing here; a manual run is there for a one-off.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LayoutProps is a global Next generates into .next/types; a fresh checkout has no .next until
      # typegen (or a build) writes it, so bare tsc fails here while passing locally.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # The smoke test runs on Google Chrome (channel "chrome"), not Playwright's bundled Chromium,
      # whose build is open to CVE-2026-118306 et al. --force only skips Playwright's "already
      # installed" guard (Actions sets CI, which skips it too), so this reinstalls current stable
      # Chrome over the runner's copy, with its system packages. Chrome lives outside
      # ~/.cache/ms-playwright, so there is nothing there to cache.
      - name: Install Google Chrome
        run: npx playwright install --with-deps --force chrome

      # A runner has no GPU, so WebGPU falls back to SwiftShader or is absent. --allow-software skips
      # the assertions that need a real WebGPU adapter and real compute, but still requires zero
      # console errors and every route to render.
      - name: Smoke test
        run: npm run test:smoke -- --allow-software
        env:
          SMOKE_SHOTS: smoke-shots

      # Each page's last screenshot and engine state, so a runner-only failure can be read, not guessed.
      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots
          path: smoke-shots/
          retention-days: 7
          if-no-files-found: ignore
