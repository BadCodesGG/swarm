name: CI

# Only the env branches build. A branch runs these checks locally before its one push, so a pull request
# runs nothing here; a manual run is there for a one-off.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LayoutProps is a global Next generates into .next/types; a fresh checkout has no .next until
      # typegen (or a build) writes it, so bare tsc fails here while passing locally.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Chromium comes from Playwright, cached on the lockfile because the binary only changes when
      # the Playwright dependency does. The install still runs: it is a no-op for the binary on a
      # cache hit, and `--with-deps` puts the system packages in place either way.
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A runner has no GPU, so WebGPU falls back to SwiftShader or is absent. --allow-software skips
      # the assertions that need a real WebGPU adapter and real compute, but still requires zero
      # console errors and every route to render.
      - name: Smoke test
        run: npm run test:smoke -- --allow-software
        env:
          SMOKE_SHOTS: smoke-shots

      # Each page's last screenshot and engine state, so a runner-only failure can be read, not guessed.
      - name: Upload smoke evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots
          path: smoke-shots/
          retention-days: 7
          if-no-files-found: ignore
