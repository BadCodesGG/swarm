name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LayoutProps is a global Next generates into .next/types; a fresh checkout has no .next until
      # typegen (or a build) writes it, so bare tsc fails here while passing locally.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Chromium comes from Playwright, cached on the lockfile because the binary only changes when
      # the Playwright dependency does. The install still runs: it is a no-op for the binary on a
      # cache hit, and `--with-deps` puts the system packages in place either way.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A runner has no GPU, so WebGPU falls back to SwiftShader or is absent. --allow-software skips
      # the assertions that need a real WebGPU adapter and real compute, but still requires zero
      # console errors and every route to render.
      - name: Smoke test
        run: npm run test:smoke -- --allow-software
